name: Release

# 打 v* 标签（如 v1.6.0）时构建插件包并发布为 GitHub Release。
# 发布需要仓库 secret：GH_TOKEN（GitHub Personal Access Token，需 contents:write 权限）；
# 未配置时回落到内置 GITHUB_TOKEN。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    # 只读即可：本 job 只做校验、打包与上传 artifact；contents:write 留给发布 job。
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 仓库不提交 lockfile（宿主包版本必须跟随本机 DSH，锁定反而会造成双副本漂移），
      # 因此这里用 npm install 而不是 npm ci。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Syntax check and unit tests
        run: npm run verify

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      # npm pack 对 scoped 包产出 duke-dsh-plugins-dsh-agent-approval-<version>.tgz；
      # 统一改名为稳定的 dsh-agent-approval-<version>.tgz，安装命令才有可预测的 URL。
      - name: Normalize tarball name
        run: mv ./*.tgz "dsh-agent-approval-${{ steps.pkg.outputs.version }}.tgz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: dsh-agent-approval-*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-agent-approval + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            dsh-agent-approval — DeepSeek Harness Agent 审批权限插件。

            ### 功能
            - 新权限模式：workspace-write 基线 + 独立审批 Agent 裁决每一次沙箱提权。
            - 审批 Agent 独立会话、零工具、结构化裁决（approve/reject + 风险等级 + 理由），风险操作直接拒绝。
            - 超时/故障一律 fail-closed（按拒绝处理），绝不静默放行；**证据不完整（参数缺失或被截断）同样拒绝**。
            - 设置面板可配置审批模型、超时与放行/拒绝规则；「审批」标签页查看本会话审计。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dsh-agent-approval-${{ needs.build.outputs.version }}.tgz
            # 重启 DSH 后，设置面板出现「Agent 审批」页，/permission 菜单出现「Agent 审批」预设
            ```
            > 本地路径安装前请先在插件目录执行 `npm install`（宿主包版本对齐本机 DSH），否则启动时会 ERR_MODULE_NOT_FOUND。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
